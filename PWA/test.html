<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            border-radius: 8px;
            border: none;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>PWA Shell Test</h1>
    <p>If you can see this, the WebView is working!</p>
    <button onclick="testHaptic()">Test Haptic</button>
    <button onclick="testAlert()">Test Alert</button>
    
    <script>
        function testHaptic() {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.haptic) {
                window.webkit.messageHandlers.haptic.postMessage('impact');
            }
            if ('vibrate' in navigator) {
                navigator.vibrate(50);
            }
            alert('Haptic triggered!');
        }
        
        function testAlert() {
            alert('Alert works!');
        }
        
        console.log('Test page loaded successfully');
    </script>
</body>
</html>
